---
name: 📈 Readme stats
"on":
  # Update weekly, every Monday at 3:00 UTC.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/readme-stats.yaml"

permissions: {}

jobs:
  stats:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          core_version: 2.1.3
          options: "show_icons=true&text_color=718096&hide_title=true&rank_icon=percentile\
            &show=prs_merged_percentage,prs_reviewed"
          path: stats.svg

      # The action exits 0 even when the GitHub API errors out, silently
      # writing a "Something went wrong" SVG. Fail the job instead of letting
      # the commit step below replace a good card with a broken one.
      - name: Reject error card
        run: "! grep --quiet 'Something went wrong' stats.svg"

      - name: Commit updated card
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add stats.svg
          git commit -m "Update readme stats card" || exit 0
          git push
