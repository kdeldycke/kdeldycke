---
name: 🔕 Unsubscribe closed threads
"on":
  workflow_dispatch:
    inputs:
      months:
        description: Unsubscribe from closed issues/PRs inactive for more than this many months
        default: 3
        type: string
      batch-size:
        description: Max threads to inspect per run (backlog clears over successive runs)
        default: 200
        type: string
      dry-run:
        description: "Dry-run: only list candidates, do not perform unsubscribing"
        default: true
        type: boolean
  schedule:
    - cron: "13 9 * * 1"

jobs:

  unsubscribe:
    uses: kdeldycke/repomatic/.github/workflows/unsubscribe.yaml@a9a1d6a43119f85ad7e04c2adf2f7bd9a0abdd10 # v7.13.0
    with:
      months: ${{ inputs.months }}
      batch-size: ${{ inputs.batch-size }}
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      REPOMATIC_NOTIFICATIONS_PAT: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT }}
