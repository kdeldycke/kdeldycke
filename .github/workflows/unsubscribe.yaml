---
name: 🔕 Unsubscribe closed threads
"on":
  workflow_dispatch:
    inputs:
      months:
        description: Unsubscribe from closed issues/PRs inactive for more than this many months
        default: 3
        type: string
      max-unsubscribes:
        description: Max threads to unsubscribe from per run (the rest defer to a later run)
        default: 200
        type: string
      dry-run:
        description: "Dry-run: only list candidates, do not perform unsubscribing"
        default: true
        type: boolean
  schedule:
    - cron: "13 9 * * 1"

jobs:

  unsubscribe:
    uses: kdeldycke/repomatic/.github/workflows/unsubscribe.yaml@v7.15.1
    with:
      months: ${{ inputs.months }}
      max-unsubscribes: ${{ inputs.max-unsubscribes }}
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      REPOMATIC_NOTIFICATIONS_PAT: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT }}
